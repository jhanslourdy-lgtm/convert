<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>

            color: var(--accent-success);
            margin-bottom: 20px;
        }

        h1 { margin-bottom: 10px; font-size: 1.8rem; }
        .file-info { color: var(--text-dim); margin-bottom: 30px; }

        /* Classes demandées : Download et Preview */
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }

            display: flex;

            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-download {
            background-color: var(--accent-success);
            color: white;
        }
        .btn-download:hover { background-color: #059669; transform: scale(1.02); }

        .btn-preview {
            background-color: var(--accent-blue);
            color: white;
        }
        .btn-preview:hover { background-color: #2563eb; transform: scale(1.02); }

            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #2d3748;

            margin-bottom: 10px;

            border-radius: 8px;

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion Terminée</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0b1220;
            --bg-secondary: #162033;
            --accent-success: #10b981;
            --accent-blue: #3b82f6;
            --accent-share: #6366f1;
        }
        body {
            background: var(--bg-primary);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: var(--bg-secondary);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn-stack { display: flex; flex-direction: column; gap: 12px; margin: 25px 0; }
        .btn {
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            color: white;
        }
        .btn:hover { transform: scale(1.02); }
        .btn-download { background: var(--accent-success); }
        .btn-preview { background: var(--accent-blue); }
        .btn-share { background: var(--accent-share); }
        
        .share-url-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--accent-blue);
            word-break: break-all;
            margin-top: 10px;
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>
    <div class="card">
        <i class="fas fa-check-circle fa-4x" style="color: var(--accent-success); margin-bottom: 20px;"></i>
        <h2>Travail terminé !</h2>
        <p style="color: #94a3b8">Fichier : <span th:text="${fileName}" style="color: white">document.docx</span></p>

        <div class="btn-stack">
            <a th:href="@{/download/{t}(t=${token})}" class="btn btn-download">
                <i class="fas fa-download"></i> Télécharger le fichier
            </a>

            <a th:if="${previewAvailable}" th:href="@{/preview/{t}(t=${token})}" target="_blank" class="btn btn-preview">
                <i class="fas fa-eye"></i> Voir l'aperçu PDF
            </a>

            <button onclick="shareLink()" class="btn btn-share">
                <i class="fas fa-share-alt"></i> Partager avec un ami
            </button>
        </div>

        <input type="hidden" id="rawUrl" th:value="${#request.requestURL.toString().replace('/convert', '/download/' + token)}">

        <a th:href="@{/}" style="color: #64748b; text-decoration: none; font-size: 0.9rem;">
            <i class="fas fa-arrow-left"></i> Revenir à l'accueil
        </a>
    </div>

    <script th:inline="javascript">
        function shareLink() {
            const urlToShare = document.getElementById('rawUrl').value;
            
            if (navigator.share) {
                navigator.share({
                    title: 'Mon document converti',
                    text: 'Salut ! Voici mon fichier converti via PDF Office.',
                    url: urlToShare
                }).catch(console.error);
            } else {
                // Fallback : copie dans le presse-papier
                navigator.clipboard.writeText(urlToShare);
                alert("Lien copié ! Vous pouvez l'envoyer à vos amis.");
            }
        }
    </script>
</body>
</html>
